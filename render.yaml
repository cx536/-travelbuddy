services:
  - type: web
    name: travelbuddy
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/ai/status
    autoDeploy: true
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: HF_ENDPOINT
        value: https://hf-mirror.com
      - key: PYTHONUNBUFFERED
        value: "1"
