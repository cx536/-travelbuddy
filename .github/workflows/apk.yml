name: build-apk

# 说明：把 TravelBuddy 线上站点打包成可直接安装的 Android APK，
# 产物自动发布到 GitHub Release（tag: apk-latest），下载地址公开可访问。
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成本地签名密钥
        working-directory: android
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias travelbuddy \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass travelbuddy -keypass travelbuddy \
            -dname "CN=TravelBuddy, OU=Travel, O=TravelBuddy, L=Shanghai, ST=Shanghai, C=CN"

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: travelbuddy
          KEY_ALIAS: travelbuddy
          KEY_PASSWORD: travelbuddy
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 收集产物
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/travelbuddy.apk
          ls -lh dist

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: TravelBuddy APK
          body: |
            自动构建的 TravelBuddy 安卓安装包（WebView 壳，打开 https://cx0821-travelbuddy.ms.show）。
            下载 travelbuddy.apk 后传到手机安装即可。
          files: dist/travelbuddy.apk
