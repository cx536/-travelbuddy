name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/travelbuddy"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA}" . 2>&1 | tail -n 60

      - name: Push image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/travelbuddy"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
